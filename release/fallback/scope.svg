<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0e1116"/><rect x="0" y="0" width="1920" height="6" fill="#ff5d7d"/><text x="90" y="118" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="650" fill="#e6ebf1" text-anchor="start">Titin across the sarcomere</text><text x="90" y="162" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#98a4b3" text-anchor="start">Human TTN reference sequence · Q8WZ42-1 · construct review pending</text><text x="90" y="262" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Sequence species: Homo sapiens</text><text x="90" y="308" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Reference: TTN — Q8WZ42-1</text><text x="90" y="354" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Tissue construct: not established; SD-01 pending</text><text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Mechanics: Mechanics parameters transferred from rat psoas preparations · SD-04 pending</text><text x="90" y="446" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Declared working range: 2000–2400 nm</text><text x="90" y="492" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Shown here at 2200 nm</text><text x="90" y="584" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">Sarcomere length controls passive geometry here; it does not set calcium activation or simulate an</text><text x="90" y="618" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">active-contraction trajectory. The 2,000–2,400 nm interval is this model's declared comparison range, not a</text><text x="90" y="652" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#98a4b3" text-anchor="start">universal range for every muscle.</text><line x1="90" y1="972" x2="1830" y2="972" stroke="#2b3440" stroke-width="1"/><text x="90" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c9b989" text-anchor="start">Static fallback rendered from the same records as the interactive build.</text></svg>
