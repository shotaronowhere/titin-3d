<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0e1116"/><rect x="0" y="0" width="1920" height="6" fill="#ff5d7d"/><text x="90" y="118" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="650" fill="#e6ebf1" text-anchor="start">What this model does not claim</text><text x="90" y="162" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#98a4b3" text-anchor="start">The full sheet ships as release/LIMITATIONS.md</text><text x="90" y="262" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No cardiac titin or alternative-isoform scene mode.</text><text x="90" y="308" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No exact cardiac cMyBP-C coordinate in the retained skeletal model.</text><text x="90" y="354" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No MyBP-C path promoted above SCHEMATIC placement evidence.</text><text x="90" y="400" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No M1 density sourced only from the 2023 averaged M-band reconstruction.</text><text x="90" y="446" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No 160 nm M-line protein slab or synonymization of M-band and bare zone.</text><text x="90" y="492" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No Z-disc depiction with one titin chain in the 2:1 telethonin sandwich.</text><text x="90" y="538" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No universal regular Z-disc lattice claim.</text><text x="90" y="584" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No automatic coupling of short sarcomere length to biochemical activation.</text><text x="90" y="630" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No source figure copied without a separately recorded compatible license.</text><text x="90" y="676" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#e6ebf1" text-anchor="start">· No presentation layer that moves a biological anchor or strengthens evidence.</text><line x1="90" y1="972" x2="1830" y2="972" stroke="#2b3440" stroke-width="1"/><text x="90" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c9b989" text-anchor="start">Every rendered object also carries its own non-claims in the Evidence drawer.</text></svg>
