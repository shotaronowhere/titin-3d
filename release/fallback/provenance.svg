<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#0e1116"/><rect x="0" y="0" width="1920" height="6" fill="#ff5d7d"/><text x="90" y="118" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="650" fill="#e6ebf1" text-anchor="start">How this model was built</text><text x="90" y="162" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#98a4b3" text-anchor="start">Every figure counted from the loaded records</text><rect x="90" y="240" width="1740" height="94" rx="8" fill="#161b22" stroke="#2b3440"/><circle cx="128" cy="287" r="9" fill="#7aa2d8"/><text x="162" y="280" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#e6ebf1" text-anchor="start">Primary paper, PDB entry, UniProt record</text><text x="162" y="314" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ff5d7d" text-anchor="start">51 cited records</text><text x="1810" y="314" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98a4b3" text-anchor="end">data/references.json</text><line x1="128" y1="334" x2="128" y2="362" stroke="#7aa2d8" stroke-width="2"/><rect x="90" y="362" width="1740" height="94" rx="8" fill="#161b22" stroke="#2b3440"/><circle cx="128" cy="409" r="9" fill="#7aa2d8"/><text x="162" y="402" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#e6ebf1" text-anchor="start">Coordinate or literature measurement</text><text x="162" y="436" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ff5d7d" text-anchor="start">33 sourced parameters</text><text x="1810" y="436" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98a4b3" text-anchor="end">data/geometry_sources.json  ·  data/context_measurements.json  ·  scripts/measure_context.py</text><line x1="128" y1="456" x2="128" y2="484" stroke="#7aa2d8" stroke-width="2"/><rect x="90" y="484" width="1740" height="94" rx="8" fill="#161b22" stroke="#2b3440"/><circle cx="128" cy="531" r="9" fill="#7aa2d8"/><text x="162" y="524" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#e6ebf1" text-anchor="start">Evidence-classified specification</text><text x="162" y="558" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ff5d7d" text-anchor="start">13 specified components and titin regions</text><text x="1810" y="558" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98a4b3" text-anchor="end">data/sarcomere.json  ·  data/titin.json  ·  data/geometry_strategy.json</text><line x1="128" y1="578" x2="128" y2="606" stroke="#7aa2d8" stroke-width="2"/><rect x="90" y="606" width="1740" height="94" rx="8" fill="#161b22" stroke="#2b3440"/><circle cx="128" cy="653" r="9" fill="#7aa2d8"/><text x="162" y="646" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#e6ebf1" text-anchor="start">Executable mechanical and geometric model</text><text x="162" y="680" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ff5d7d" text-anchor="start">4 defined structural states, continuously solved between</text><text x="1810" y="680" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98a4b3" text-anchor="end">data/mechanical_model.json  ·  src/geometry/MechanicalModel.js</text><line x1="128" y1="700" x2="128" y2="728" stroke="#7aa2d8" stroke-width="2"/><rect x="90" y="728" width="1740" height="94" rx="8" fill="#161b22" stroke="#2b3440"/><circle cx="128" cy="775" r="9" fill="#7aa2d8"/><text x="162" y="768" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#e6ebf1" text-anchor="start">Procedural render</text><text x="162" y="802" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ff5d7d" text-anchor="start">14 declared render primitives</text><text x="1810" y="802" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98a4b3" text-anchor="end">data/geometry_strategy.json  ·  src/render/SarcomereScene.js</text><line x1="128" y1="822" x2="128" y2="850" stroke="#7aa2d8" stroke-width="2"/><rect x="90" y="850" width="1740" height="94" rx="8" fill="#161b22" stroke="#2b3440"/><circle cx="128" cy="897" r="9" fill="#7aa2d8"/><text x="162" y="890" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#e6ebf1" text-anchor="start">Positive and destructive negative tests</text><text x="162" y="924" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#ff5d7d" text-anchor="start">14 declared destructive controls and forbidden depiction rules</text><text x="1810" y="924" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98a4b3" text-anchor="end">data/showcase_claims.json  ·  scripts/validate_geometry.py  ·  scripts/neg_control_showcase_claims.py</text><line x1="90" y1="972" x2="1830" y2="972" stroke="#2b3440" stroke-width="1"/><text x="90" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c9b989" text-anchor="start">Not claimed: that AI is a scientific authority; that passing tests proves every biological interpretation; that procedural geometry is experimental</text><text x="90" y="1028" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c9b989" text-anchor="start">density.</text></svg>
